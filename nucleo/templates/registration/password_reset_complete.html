{% extends 'base.html' %}

{% block title %}Contraseña actualizada{% endblock %}

{% block content %}
<div class="container-tight py-4">
    <div class="card card-md">
        <div class="card-body text-center py-5">
            <div class="mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2fb344" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9 12l2 2 4-4"></path>
                </svg>
            </div>
            <h2 class="card-title mb-3">Contraseña actualizada</h2>
            <p class="text-muted mb-4">
                Tu contraseña se cambió exitosamente.
                Ya puedes iniciar sesión con tu nueva contraseña.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary">
                Iniciar sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
