{% load static %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        
        <!-- Logo Corporativo -->
        <div class="text-center mb-3">
            <img src="{% static 'img/photo.jpg' %}" alt="Logo Granja" class="login-logo">
        </div>

        <!-- Títulos -->
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1 text-dark">Granja Mercados</h4>
            <span class="text-muted small">Inicia sesión para continuar</span>
        </div>

        <!-- Formulario -->
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3 text-start">
                <label for="id_username" class="form-label fw-bold text-secondary small mb-1">Usuario</label>
                <input type="text" name="username" id="id_username" class="form-control custom-input" required autofocus>
            </div>

            <div class="mb-4 text-start">
                <label for="id_password" class="form-label fw-bold text-secondary small mb-1">Contraseña</label>
                <input type="password" name="password" id="id_password" class="form-control custom-input" required>
            </div>

            <button type="submit" class="btn btn-granja w-100 py-2 fw-bold">
                Iniciar sesión
            </button>
        </form>
        <a href="{% url 'singup' %}">
            <button class="btn btn-granja w-100 py-2 fw-bold">Sign Up</button>
        </a>
    </div>
</div>

<style>
    /* Fondo pantalla completa */
    .login-wrapper {
        min-height: 100vh;
        background-color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
    }

    /* Tarjeta Flotante */
    .login-card {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 2.5rem 2rem;
        border-radius: 18px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        border: 1px solid #e5e7eb;
    }

    /* Logo */
    .login-logo {
        max-height: 65px;
        width: auto;
        object-fit: contain;
    }

    /* Campos de Entrada */
    .custom-input {
        border-radius: 10px !important;
        border: 1px solid #d1d5db !important;
        padding: 0.65rem 0.9rem !important;
        font-size: 0.95rem;
        background-color: #ffffff;
        transition: all 0.2s ease-in-out;
    }

    /* Efecto Verde Neón al enfocar el input */
    .custom-input:focus {
        border-color: #82ec00 !important;
        box-shadow: 0 0 0 3px rgba(130, 236, 0, 0.35) !important;
        outline: none;
    }

    /* Botón Verde Granja */
    .btn-granja {
        background-color: #82ec00 !important;
        color: #000000 !important;
        border: none !important;
        border-radius: 10px !important;
        font-size: 1rem;
        transition: background-color 0.2s ease-in-out, transform 0.1s ease;
    }

    .btn-granja:hover {
        background-color: #74d400 !important;
        color: #000000 !important;
    }

    .btn-granja:active {
        transform: scale(0.98);
    }
</style>
{% endblock content %}
